<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Page">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles/login.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-container form {
            display: flex;
            flex-direction: column;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
        }

        .login-container button {
            padding: 10px;
            font-size: 16px;
            color: white;
            background-color: #005f6b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-container button:hover {
            background-color: #004d5a;
        }

        .login-container .forgot-password {
            text-align: right;
            margin-top: 10px;
        }

        .login-container .forgot-password a {
            color: #005f6b;
            text-decoration: none;
            font-size: 14px;
        }

        .login-container .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-container .signup {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-container .signup a {
            color: #005f6b;
            text-decoration: none;
        }

        .login-container .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Вхід</h2>
    <form action="/login" method="post">
        <label for="username">Ім'я користувача</label>
        <input type="text" id="username" name="username" placeholder="Введіть ім'я користувача" required>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Введіть пароль" required>

        <button type="submit">Увійти</button>
    </form>
    <div class="forgot-password">
        <a href="#">Забули пароль?</a>
    </div>
    <div class="signup">
        Немає акаунта? <a href="/signup">Зареєструватися</a>
    </div>
</div>
</body>
</html>
